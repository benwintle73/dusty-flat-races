<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off To The Races</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout idea: a country track's tote board (amber on black) bolted above a printed form guide (newsprint). */
:root{
  --tote:#16120c; --tote2:#2a2317; --amber:#ffb52e; --amber-dim:#a87a2a;
  --paper:#efe4c8; --paper2:#e2d3ae; --ink:#241c10; --ink2:#675740;
  --red:#c8321f; --good:#2f8a4a;
  --display:"Pixelify Sans","Courier New",monospace;
  --led:"VT323","Courier New",monospace;
  --body:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0e2b1a;color:var(--paper);font-family:var(--body)}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 28px;display:grid;gap:12px}
.mast{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;background:var(--tote);border:3px solid var(--tote2);padding:8px 14px}
.mast h1{margin:0;font:700 clamp(24px,4vw,34px)/1 var(--display);color:var(--amber);letter-spacing:.5px}
.mast .meet{font:22px/1 var(--led);color:var(--amber-dim);flex:1 1 200px}
.led{display:flex;flex-direction:column;align-items:flex-end}
.led small{font:18px/1 var(--led);color:var(--amber-dim)}
.led b{font:400 36px/1 var(--led);color:var(--amber);font-variant-numeric:tabular-nums}
.led b.up{color:#7dff9b}.led b.down{color:#ff7a66}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"stage card" "slip card";align-items:start}
.stage{grid-area:stage;background:var(--tote);border:3px solid var(--tote2)}
.canvas-wrap{position:relative;line-height:0}
canvas{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
#photo{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--red);color:#fff;font:700 24px/1.2 var(--display);padding:4px 16px;display:none}
.call{font:24px/1.1 var(--led);color:var(--amber);padding:8px 12px;min-height:60px}
.call b{font-weight:400;color:#fff}
.slip{grid-area:slip;background:var(--tote);border:3px solid var(--tote2);padding:12px;display:grid;gap:10px}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.seg button{background:var(--tote2);color:var(--paper);border:0;min-height:44px;padding:2px;font-weight:600;font-size:15px}
.seg button[aria-pressed=true]{background:var(--amber);color:var(--tote)}
.hint{font-size:16px;color:var(--paper2);min-height:22px}
.hint b{color:var(--amber);font:22px/1 var(--led)}
.stake{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stake label{font-weight:600}
#stake{width:92px;min-height:44px;background:#000;color:var(--amber);border:2px solid var(--tote2);font:28px/1 var(--led);padding:2px 8px}
.chip{min-height:44px;min-width:50px;background:var(--tote2);color:var(--paper);border:0;font-weight:600;padding:0 8px}
.go{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{min-height:52px;border:0;font:700 19px/1 var(--display);padding:4px 8px}
.big.place{background:var(--paper);color:var(--ink)}
.big.jump{background:var(--red);color:#fff}
.big:disabled{opacity:.45;cursor:not-allowed}
.bets{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.bets li{display:flex;gap:8px;align-items:center;background:var(--tote2);padding:4px 4px 4px 10px;font-size:16px}
.bets li span{flex:1;min-width:0}
.bets li button{background:none;border:0;color:var(--paper2);min-width:44px;min-height:36px;text-decoration:underline}
.nan{background:none;border:2px solid var(--amber);color:var(--amber);min-height:48px;font-weight:700}
.card{grid-area:card;background:var(--paper);color:var(--ink);border:3px solid var(--paper2);padding:12px;display:grid;gap:8px}
.card h2{margin:0;font:700 25px/1.05 var(--display);text-wrap:balance}
.conds{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:600;color:var(--ink2);font-size:16px}
.conds .wet{color:#1e5a9c}
.tip{font-size:16px;border-left:4px solid var(--red);padding:2px 8px;background:var(--paper2)}
.runners{display:grid;gap:0}
.runner{display:grid;grid-template-columns:36px minmax(0,1fr) 72px 72px;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid #bda97f;color:inherit;padding:7px 4px;min-height:60px}
.runner:hover{background:var(--paper2)}
.runner.on{background:#f8c65f}
.silk{width:34px;height:34px;display:grid;place-items:center;font:700 25px/1 var(--body);border:2px solid var(--ink);position:relative}
.silk i{position:absolute;right:-7px;top:-8px;background:var(--red);color:#fff;font:700 13px/18px var(--body);width:18px;height:18px;text-align:center}
.rname{font-weight:700;font-size:18px;line-height:1.1;overflow-wrap:anywhere}
.rmeta{font-size:14px;color:var(--ink2);line-height:1.2}
.rmeta b{color:var(--ink);letter-spacing:1px}
.odds{text-align:right;font:400 25px/1 var(--led);white-space:nowrap;font-variant-numeric:tabular-nums}
.odds small{display:block;font:600 11px/1.3 var(--body);color:var(--ink2);text-transform:uppercase}
.tbl{width:100%;border-collapse:collapse;font-size:17px}
.tbl td,.tbl th{padding:5px 4px;border-top:1px solid #bda97f;text-align:left;vertical-align:top}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.won{color:var(--good);font-weight:700}.lost{color:var(--red)}
.net{font:700 28px/1.1 var(--display)}
.card .big.next{background:var(--ink);color:var(--paper);width:100%}
.card .big.place{background:var(--paper2);color:var(--ink);border:2px solid var(--ink)}
#detail{font-size:15px}
#detail table{width:100%;border-collapse:collapse}
#detail td,#detail th{padding:3px 5px;border-top:1px solid var(--tote2);text-align:left}
#detail th{color:var(--amber-dim);font-weight:600}
#detail b{color:var(--amber)}
.reset{background:none;border:0;color:var(--ink2);text-decoration:underline;min-height:40px;justify-self:start;padding:0}
.foot{font-size:14px;color:#a9c0a6;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.foot button{background:none;border:1px solid #6d8a6c;color:#d8e4d4;min-height:40px;padding:0 12px}
@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "card" "slip"}
  .seg{grid-template-columns:repeat(3,1fr)}
  .led b{font-size:30px}
  .runner{grid-template-columns:36px minmax(0,1fr) 56px 56px;gap:6px}
  .odds{font-size:21px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>Off To The Races</h1>
    <div class="meet" id="meet"></div>
    <div class="led"><small>RACE</small><b id="raceNo"></b></div>
    <div class="led"><small>BANK</small><b id="bank"></b></div>
  </header>
  <div class="grid">
    <section class="stage" aria-label="Track">
      <div class="canvas-wrap"><canvas id="c" width="720" height="354"></canvas><div id="photo">PHOTO</div></div>
      <div class="call" id="call" aria-live="polite"></div>
    </section>
    <section class="card" id="card"></section>
    <section class="slip" id="slip">
      <div class="seg" id="seg"></div>
      <div class="hint" id="hint"></div>
      <div id="detail"></div>
      <div class="stake">
        <label for="stake">Stake $</label>
        <input id="stake" type="number" inputmode="numeric" min="1" step="1" value="25">
        <button class="chip" data-add="5">+5</button>
        <button class="chip" data-add="25">+25</button>
        <button class="chip" data-add="100">+100</button>
        <button class="chip" data-all="1">All in</button>
        <button class="chip" data-clear="1">Clear</button>
      </div>
      <div class="go">
        <button class="big place" id="place">Place bet</button>
        <button class="big jump" id="jump">Jump</button>
      </div>
      <ul class="bets" id="bets"></ul>
      <button class="nan" id="nan" hidden>Ring Nan for $200</button>
    </section>
  </div>
  <footer class="foot">
    <span id="foot">Play money only. No real bets, deposits or prizes.</span>
    <span style="display:flex;gap:8px"><button id="realbtn">Real Races</button><button id="daily">Play Daily Meeting</button><button id="mute">Sound on</button></span>
  </footer>
</div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
let RNG=Math.random;
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function withSeed(seed,fn){RNG=mulberry(seed);try{return fn()}finally{RNG=Math.random}}
const rand=(a=1,b)=>b===undefined?RNG()*a:a+RNG()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=()=>{let u=0,v=0;while(!u)u=RNG();while(!v)v=RNG();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=irand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[irand(0,a.length-1)];
const money=v=>{const r=Math.round(v*100)/100;return (r<0?"-$":"$")+Math.abs(r).toLocaleString("en-AU",{minimumFractionDigits:r%1?2:0,maximumFractionDigits:2})};
const div=v=>"$"+v.toFixed(2);
const oddsTxt=v=>"$"+(v<10?v.toFixed(2):String(+v.toFixed(1)));
const hash=n=>{const s=Math.sin(n*127.1+3.3)*43758.5453;return s-Math.floor(s)};

/* ---------- data ---------- */
const NAMES=["Pie Floater","Dusty Ute","Nan's Bingo Money","Servo Sausage","Thongs At The Wedding","She'll Be Right","Sunday Arvo","Two Up Tony","Cold Stubby","Galah Dinner","Bogan Villea","Drop Bear Alert","Fair Suck","Yeah Nah","Nah Yeah","Bin Chicken","Snag In Bread","Ute Muster","Smoko","Tradies Lunch","Mozzie Coil","Stubby Holder","Esky Lid","Wheelie Bin Night","Back Of Bourke","Beyond Ballarat","Goldfields Gal","Maryborough Mick","Pyrenees Lass","Hot Chip Minimum","Dim Sim Dave","Whipper Snipper","Roundabout Rita","Hills Hoist","Cattle Grid","Chook Raffle","Meat Tray","Second Prize Meat Tray","Rissole","Lamington Drive","Flat White Lie","Sausage Sizzle","Footy Trip","Grey Nomad","Caravan Park","Rusty Gate","Blowfly Betty","Tuckshop Lady"];
const JOCKS=["T. Bilby","A. Currawong","S. Wombat","R. Quoll","K. Dunnart","M. Echidna","J. Kookaburra","P. Numbat","L. Potoroo","D. Bandicoot","C. Magpie","N. Wallaroo"];
const COATS=[["#6b3a1e","#1f130c"],["#8a4a22","#4b2412"],["#3a2316","#120b08"],["#9b9690","#4a4744"],["#a35a24","#d9b078"],["#2a2526","#0c0a0a"]];
const SILKS=[["#d8342a","#fff"],["#f4f1e6","#111"],["#2a62c9","#fff"],["#f2c92b","#111"],["#2a9a55","#fff"],["#1b1b22","#f2c92b"],["#ef7d22","#111"],["#ec7fb0","#111"],["#25b5c4","#111"]];
const TIERS=[
 {name:"Country",need:0,max:500,theme:0,cup:["The Goldfields Cup",2400],tracks:["Dusty Flat","Goat Creek","Mount Misery","Wattle Gully","Lake Nowhere","Bullock Bend"]},
 {name:"Provincial",need:3000,max:2000,theme:1,cup:["The Riverbend Cup",2400],tracks:["Riverbend Park","Kingfisher Downs","Sandy Reach"]},
 {name:"Metro",need:12000,max:10000,theme:2,cup:["The Royal Parade Stakes",2400],tracks:["Royal Parade","Harbour Heath","Southbank Park"]},
 {name:"Spring Carnival",need:60000,max:100000,theme:3,cup:["The Championship Cup",3200],tracks:["Championship Park"]}];
const CHAMP=250000;
const TRACKS=TIERS.flatMap(t=>t.tracks);
const RACES=[["Servo Pie Maiden",1000],["Hot Chips Handicap",1200],["CWA Scone Plate",1400],["Shire Council Sprint",1200],["Ute Muster Mile",1600],["Tuckshop Stakes",1800],["Publican's Purse",2000],["Cup",2400]];
const NAN=["Says it winked at her.","She liked the socks on the jockey.","Her hairdresser's cousin knows the farrier.","Picked it with a hatpin.","It's the same name as her first budgie."];
const RANK=[[0,"Mug punter"],[1,"Hanging on"],[1.25,"Handy on the punt"],[2,"Sharp at the rails"],[4,"Bookies know your face"]];
const ratingName=r=>(r<=4?"Good ":r<=7?"Soft ":"Heavy ")+r;
const STYLE={front:"Leader",mid:"Midfield",back:"Closer"};

/* ---------- race simulation ---------- */
function simulate(field,race,rec){
  const D=race.dist,n=field.length,dt=.25,w=clamp((race.rating-5)/5,0,1);
  const pos=new Float64Array(n),fin=new Float64Array(n),nz=new Float64Array(n),vv=new Float64Array(n);
  const day=[],slow=[],luck=[];
  for(let k=0;k<n;k++){const h=field[k];
    day.push(gauss()*.22*(1.3-h.cons*.6));
    slow.push(RNG()<.05?.55:rand(0,.14));
    luck.push(RNG()<.06?{p:rand(.35,.75),left:2.2,fired:false}:null);
  }
  const trace=rec?[Array.from(pos)]:null,events=[];
  let done=0,t=0,extra=0;
  while(rec?extra<28:done<n){
    for(let k=0;k<n;k++){
      const h=field[k],p=Math.min(1,pos[k]/D);
      let v=16.6+h.q*.58+day[k]-(h.weight-56)*.022-w*1.2+w*(h.wet-.5)*.9;
      if(h.style==="front")v+=p<.6?.34:.34-1.0*(p-.6)/.4;
      else if(h.style==="back")v+=p<.6?-.42:-.42+1.35*(p-.6)/.4;
      const need=(D-1000)/2200,short=Math.max(0,need-h.sta+.1);
      v-=short*1.7*Math.max(0,p-.55)/.45;
      if(p<.2)v-=Math.max(0,h.barrier-5)*.012*(D<1400?1.5:1);
      nz[k]=.9*nz[k]+.1*gauss()*.55;v+=nz[k];
      const l=luck[k];
      if(l&&p>=l.p&&l.left>0){v-=1.1;l.left-=dt;if(!l.fired){l.fired=true;if(rec)events.push({t,k})}}
      if(fin[k])v=Math.max(7,(16.6+h.q*.58)*(1-Math.min(.6,(t-fin[k])*.06)));
      const a=clamp((t-slow[k])/2.6,0,1);v*=a*a*(3-2*a);
      const before=pos[k];pos[k]+=v*dt;vv[k]=v;
      if(!fin[k]&&pos[k]>=D){fin[k]=t+dt*(D-before)/(pos[k]-before);done++}
    }
    t+=dt;
    if(rec){trace.push(Array.from(pos));if(done===n)extra++}
    if(t>500)break;
  }
  const order=[...Array(n).keys()].sort((a,b)=>fin[a]-fin[b]);
  return {order,fin:Array.from(fin),trace,events,dt};
}

/* ---------- odds ---------- */
function ladder(o){
  const st=o<2?.05:o<5?.1:o<10?.5:o<20?1:o<50?5:10;
  return Math.round(clamp(Math.round(o/st)*st,1.1,201)*100)/100;
}
function priceRace(race){
  const f=race.field,n=f.length,N=600,win=new Array(n).fill(0),pl=new Array(n).fill(0);
  for(let s=0;s<N;s++){const r=simulate(f,race,false);win[r.order[0]]++;for(let i=0;i<race.placeN;i++)pl[r.order[i]]++}
  let mkt=win.map(c=>(c+.7)/(N+.7*n)*Math.exp(gauss()*.16));
  const sum=mkt.reduce((a,b)=>a+b,0);
  race.fair=mkt.map(m=>m/sum);
  f.forEach((h,i)=>{
    h.win=ladder(1/(race.fair[i]*1.16));
    const pp=clamp((pl[i]+.7)/(N+1.4)*Math.exp(gauss()*.1),.02,.97);
    h.place=Math.max(1.05,Math.round(ladder(1/(pp*1.12))*100)/100);
  });
}
function oddsFor(type,sel){
  const r=S.race,p=sel.map(i=>r.fair[i]);
  let prob;
  if(type==="win")return r.field[sel[0]].win;
  if(type==="place")return r.field[sel[0]].place;
  if(type==="exacta")prob=p[0]*p[1]/(1-p[0]);
  if(type==="quin")prob=p[0]*p[1]/(1-p[0])+p[1]*p[0]/(1-p[1]);
  if(type==="tri")prob=p[0]*p[1]/(1-p[0])*p[2]/(1-p[0]-p[1]);
  return Math.round(clamp(1/(prob*1.22),1.2,2500)*10)/10;
}

/* ---------- game state ---------- */
const TYPES={win:["Win",1],place:["Place",1],ew:["E/W",1],quin:["Quinella",2],exacta:["Exacta",2],tri:["Trifecta",3]};
let S=null;
function makeHorse(name){
  const q=clamp(.5+gauss()*.24,.05,.97),sta=rand(.05,1);
  const form=Array.from({length:5},()=>{if(RNG()<.08)return "x";const v=Math.round(1+(1-q)*7+gauss()*2.1);return v>=10?"0":String(clamp(v,1,9))}).join("");
  const runs=[...form].map(p=>({t:pick(TRACKS),d:pick([1000,1200,1400,1600,2000,2400]),r:irand(3,9),p,n:irand(7,14)}));
  return {name,q,sta,style:pick(["front","mid","mid","back"]),wet:rand(0,1),cons:rand(.1,1),form,runs,jock:pick(JOCKS),coat:irand(0,COATS.length-1)};
}
function newMeeting(){
  S.pool=shuffle(NAMES).map(makeHorse);
  S.track=pick(TIERS[S.tier||0].tracks);
  S.weather=irand(3,9);
  S.idx=0;S.startBank=S.bank;S.ledger=[];
  buildRace();
}
function wetRecord(h){
  const st=irand(3,9),w=Math.round(st*h.q*h.wet*.75);
  return `${st}:${w}`;
}
function buildRace(){
  if(S.mode==="real")return buildReal();
  const T=TIERS[S.tier||0];const [title,dist]=S.idx===7?T.cup:RACES[S.idx];
  const last=S.lastNames||[];
  let pool=S.pool.filter(h=>!last.includes(h.name));
  const n=S.idx===7?9:irand(6,9);
  let chosen=S.idx===7?pool.slice().sort((a,b)=>b.q-a.q).slice(0,n):shuffle(pool).slice(0,n);
  chosen=shuffle(chosen);
  const rating=clamp(S.weather+irand(-1,1),3,10);
  const barriers=shuffle([...Array(n).keys()].map(i=>i+1));
  const field=chosen.map((h,i)=>({...h,no:i+1,barrier:barriers[i],
    weight:Math.round(clamp(53.5+h.q*6+rand(-1,1),51,61)*2)/2,
    trip:Math.round((1000+h.sta*2200)/200)*200,wetRec:wetRecord(h)}));
  const race={title,dist,rating,field,placeN:n>=8?3:2,no:S.idx+1};
  priceRace(race);
  const nanPick=field.slice().sort((a,b)=>b.q+gauss()*.25-a.q)[0];
  race.tip={name:nanPick.name,no:nanPick.no,why:pick(NAN)};
  S.race=race;S.bets=[];S.sel=[];S.phase="bet";S.result=null;
  save();
}
function fresh(){
  S={bank:1000,meeting:1,best:1000,bigCollect:0,loans:0,type:"win",sel:[],bets:[],phase:"bet",ledger:[],tier:0,mode:"career",dailyDone:{}};
  newMeeting();
}
function save(){try{localStorage.setItem("dustyflat2",JSON.stringify(S))}catch(e){}}
function load(data){
  if(data&&data.race){S=data;return}
  try{const d=JSON.parse(localStorage.getItem("dustyflat2"));if(d&&d.race){S=d;return}}catch(e){}
  fresh();
}

/* ---------- sound ---------- */
let AC=null,muted=false;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function tone(f,d,when=0,type="square",vol=.05){
  if(!AC||muted)return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+when;
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);
}
let crowd=null;
function startCrowd(){if(!AC||muted||crowd)return;const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=l*.86+(Math.random()-.5)*.14;d[i]=l*3}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g0=AC.createGain();s.buffer=b;s.loop=true;f.type="bandpass";f.frequency.value=1100;f.Q.value=.6;g0.gain.value=.05;s.connect(f).connect(g0).connect(AC.destination);s.start();crowd={s,g:g0}}
function crowdLevel(v){if(crowd)crowd.g.gain.setTargetAtTime(v,AC.currentTime,.4)}
function stopCrowd(){if(crowd){crowd.g.gain.setTargetAtTime(0,AC.currentTime,.5);const c=crowd;crowd=null;setTimeout(()=>{try{c.s.stop()}catch(e){}},1600)}}

function renderCard(){
  if(picker)return renderPicker();
  const r=S.race,c=$("card");
  if(S.phase==="result")return renderResult();
  if(S.phase==="end")return renderEnd();
  const wet=r.rating>=6?" wet":"";
  c.innerHTML=`<h2>${r.realNo?"R"+r.realNo+" ":""}${r.title}</h2>
  <div class="conds"><span>${r.dist}m</span><span class="${wet}">${r.trackLabel||ratingName(r.rating)}</span><span>${r.field.length} runners</span><span>Pays ${r.placeN} places</span></div>
  <div class="tip">Nan's tip: <b>${r.tip.no}. ${r.tip.name}</b>. ${r.tip.why}</div>
  <div class="runners">${r.field.map((h,k)=>{
    const i=S.sel.indexOf(k),on=i>=0;
    const tag=on&&TYPES[S.type][1]>1?(S.type==="quin"?"•":i+1):"";
    return `<button class="runner${on?" on":""}" data-k="${k}" aria-pressed="${on}" ${S.phase!=="bet"?"disabled":""}>
      ${silk(h,k,tag)}
      <span><span class="rname">${h.name}</span><br><span class="rmeta">${h.real?`${h.form?`<b>${h.form}</b> · `:""}B${h.realBarrier} · ${h.weight}kg · ${h.jock}<br>${h.trainer||""}${h.speed?" · "+h.speed:""}`:`<b>${h.form}</b> · B${h.barrier} · ${h.weight}kg · ${h.jock}<br>${STYLE[h.style]} · Best ${h.trip}m · Wet ${h.wetRec}`}</span></span>
      <span class="odds"><small>Win</small>${oddsTxt(h.win)}</span>
      <span class="odds"><small>Place</small>${oddsTxt(h.place)}</span>
    </button>`}).join("")}</div>`;
}
function renderResult(){
  const r=S.race,x=S.result,c=$("card"),net=x.ret-x.staked;
  const lbl=x.margin<.1?"Short head":x.margin<.5?"Half a length or less":x.margin.toFixed(1)+" lengths";
  c.innerHTML=`<h2>Result: ${r.title}</h2>
  <table class="tbl">${x.order.slice(0,3).map((k,i)=>{const h=r.field[k];return `<tr><td>${silk(h,k)}</td><td><b>${["1st","2nd","3rd"][i]}</b> ${h.name}</td><td class="n">${i===0?"W "+div(h.win):""}<br>${i<r.placeN?"P "+div(h.place):""}</td></tr>`}).join("")}</table>
  <div class="conds"><span>Margin: ${lbl}</span><span>Quinella ${div(x.quin)}</span><span>Exacta ${div(x.exacta)}</span><span>Trifecta ${div(x.tri)}</span></div>
  ${x.bets.length?`<table class="tbl">${x.bets.map(b=>`<tr><td>${b.label}<br><small>${money(b.stake)} at ${div(b.odds)}</small></td><td class="n ${b.w?"won":"lost"}">${b.w?money(b.pay):"Lost"}</td></tr>`).join("")}</table>
  <div class="net ${net>0?"won":net<0?"lost":""}">${net>0?"Collect "+money(x.ret):net<0?"Down "+money(-net):"Square"}</div>`:`<div>No bets on this one.</div>`}
  <div class="go"><button class="big place" id="replay">Watch replay</button><button class="big next" id="next">${S.idx>=lastIdx()?"Meeting result":"Next race"}</button></div>`;
  $("next").onclick=nextRace;$("replay").onclick=replay;
}
function renderEnd(){
  const net=S.bank-S.startBank,ratio=S.bank/Math.max(1,S.startBank+0);
  let title=RANK[0][1];for(const [m,t] of RANK)if(ratio>=m)title=t;
  if(S.mode!=="career"){
    $("card").innerHTML=`<h2>${S.mode==="real"?S.track+" done":"Daily Meeting done"}</h2><div class="net ${net>=0?"won":"lost"}">Final bank ${money(S.bank)}</div><div class="tip">Verdict: <b>${title}</b></div>
    <table class="tbl">${S.ledger.map(l=>`<tr><td>Race ${l.no}</td><td class="n">Bet ${money(l.staked)}</td><td class="n ${l.ret>l.staked?"won":l.ret<l.staked?"lost":""}">${money(l.ret-l.staked)}</td></tr>`).join("")}</table>
    <button class="big next" id="dd">Back to career</button>`;$("dd").onclick=finishDaily;return}
  const next=TIERS[S.tier+1];
  const banner=S.champ?`<div class="tip"><b>Champion punter.</b> You beat the Spring Carnival with ${money(S.bank)}.</div>`:S.promoted?`<div class="tip"><b>Promoted to ${TIERS[S.tier].name}.</b> Bet limit is now ${money(TIERS[S.tier].max)}.</div>`:next?`<div class="tip">${money(next.need)} in the bank moves you up to ${next.name}.</div>`:`<div class="tip">Finish a meeting with ${money(CHAMP)} to be champion.</div>`;
  $("card").innerHTML=`<h2>${S.track} is done for the day</h2>${banner}
  <div class="net ${net>=0?"won":"lost"}">${net>=0?"Up":"Down"} ${money(Math.abs(net))}</div>
  <div class="tip">Verdict: <b>${title}</b></div>
  <table class="tbl">${S.ledger.map(l=>`<tr><td>Race ${l.no}</td><td class="n">Bet ${money(l.staked)}</td><td class="n ${l.ret>l.staked?"won":l.ret<l.staked?"lost":""}">${money(l.ret-l.staked)}</td></tr>`).join("")}</table>
  <div class="conds"><span>Best bank ${money(S.best)}</span><span>Biggest collect ${money(S.bigCollect||0)}</span><span>Calls to Nan ${S.loans}</span></div>
  <button class="big next" id="nm">Next meeting</button>
  <button class="reset" id="rs">Start over with $1,000</button>`;
  $("nm").onclick=nextMeeting;
  $("rs").onclick=()=>{const dd=S.dailyDone;fresh();S.dailyDone=dd;R=null;renderAll();say("Fresh start. Betting open.")};
}
const maxBet=()=>S.mode!=="career"?Infinity:TIERS[S.tier].max;
function renderDetail(){
  const el=$("detail"),k=S.sel[S.sel.length-1];
  if(S.phase!=="bet"||k===undefined){el.innerHTML="";return}
  const h=S.race.field[k],pool=(S.pool||[]).find(p=>p.name===h.name)||h;
  if(h.real){el.innerHTML=`<b>${h.name}</b> · ${h.jock}${h.trainer?" · "+h.trainer:""}${h.form?`<br>Recent form: ${h.form}`:""}`;return}
  el.innerHTML=`<b>${h.name}</b> last starts<table><tr><th>Track</th><th>Dist</th><th>Going</th><th>Finish</th></tr>${[...pool.runs].reverse().map(r=>`<tr><td>${r.t}</td><td>${r.d}m</td><td>${ratingName(r.r)}</td><td>${r.p==="x"?"Spell":r.p==="0"?"10th+":r.p+"/"+r.n}</td></tr>`).join("")}</table>`;
}
function renderSlip(){
  const bet=S.phase==="bet";
  $("seg").innerHTML=Object.entries(TYPES).map(([k,v])=>`<button data-t="${k}" aria-pressed="${S.type===k}" ${bet?"":"disabled"}>${v[0]}</button>`).join("");
  document.querySelectorAll(".stake button,#stake").forEach(e=>e.disabled=!bet);
  $("bets").innerHTML=S.bets.map((b,i)=>`<li><span>${b.label} · ${money(b.stake)} at ${div(b.odds)}</span>${bet?`<button data-rm="${i}">Remove</button>`:""}</li>`).join("");
  $("jump").textContent=S.phase==="race"?"Skip to result":bet?(S.bets.length?"Jump":"Jump with no bet"):"Racing done";
  $("jump").disabled=S.phase!=="bet"&&S.phase!=="race";
  $("nan").hidden=!(bet&&S.mode==="career"&&S.bank<5&&!S.bets.length);
  renderDetail();updateHint();
}
function updateHint(){
  const bet=S.phase==="bet",need=TYPES[S.type][1],btn=$("place");
  if(!bet){$("hint").textContent=S.phase==="race"?"Bets are locked. Good luck.":"";btn.disabled=true;return}
  const st=stake(),cost=S.type==="ew"?st*2:st;
  const limit=maxBet(),ready=S.sel.length===need,afford=cost>=1&&cost<=S.bank&&cost<=limit;
  btn.disabled=!(ready&&afford);
  if(!ready){
    const left=need-S.sel.length;
    $("hint").textContent=S.type==="exacta"||S.type==="tri"?`Tap runners in finishing order. ${left} to go.`:`Tap ${left} ${left>1?"runners":"runner"} in the form guide.`;
  }else if(cost>S.bank)$("hint").textContent=`That costs ${money(cost)} and you have ${money(S.bank)}. Lower the stake.`;
  else if(cost>limit)$("hint").textContent=`${TIERS[S.tier].name} limit is ${money(limit)} a bet. Lower the stake.`;
  else if(cost<1)$("hint").textContent="Enter a stake of at least $1.";
  else if(S.type==="ew"){const h=S.race.field[S.sel[0]];$("hint").innerHTML=`Costs ${money(cost)}. Win returns <b>${money(st*h.win)}</b> plus place <b>${money(st*h.place)}</b>`}
  else{const o=oddsFor(S.type,S.sel);$("hint").innerHTML=`${div(o)} returns <b>${money(st*o)}</b> on a ${money(st)} stake`}
}
function renderAll(){renderHeader();renderCard();renderSlip()}
function labelFor(type,sel){
  const f=S.race.field;
  if(TYPES[type][1]===1)return `${TYPES[type][0]} ${f[sel[0]].no}. ${f[sel[0]].name}`;
  return `${TYPES[type][0]} ${sel.map(k=>f[k].no).join(type==="quin"?" & ":"-")}`;
}
function addBet(type,sel,st){S.bets.push({type,sel:sel.slice(),stake:st,odds:oddsFor(type,sel),label:labelFor(type,sel)})}
$("place").onclick=()=>{
  const st=stake(),t=S.type,cost=t==="ew"?st*2:st;
  if(cost>S.bank||cost>maxBet()||S.sel.length!==TYPES[t][1]||st<1)return;
  audio();tone(660,.05);
  if(t==="ew"){addBet("win",S.sel,st);addBet("place",S.sel,st)}else addBet(t,S.sel,st);
  S.bank=Math.round((S.bank-cost)*100)/100;S.sel=[];save();renderAll();
};
$("jump").onclick=()=>{S.phase==="race"?skipRace():S.phase==="bet"&&startRace()};
$("nan").onclick=()=>{S.bank+=200;S.loans++;save();renderAll();say("Nan sighs and transfers $200. She says it's the last time. It isn't.")};
$("card").addEventListener("click",e=>{
  const mb=e.target.closest("[data-m]");if(mb){startReal(picker.meetings[+mb.dataset.m]);return}
  const b=e.target.closest("[data-k]");if(!b||S.phase!=="bet")return;
  const k=+b.dataset.k,need=TYPES[S.type][1],i=S.sel.indexOf(k);
  if(i>=0)S.sel.splice(i,1);else if(need===1)S.sel=[k];else if(S.sel.length<need)S.sel.push(k);
  renderCard();renderDetail();updateHint();
});
$("seg").addEventListener("click",e=>{const t=e.target.dataset.t;if(!t)return;S.type=t;S.sel=S.sel.slice(0,TYPES[t][1]);renderCard();renderSlip()});
$("bets").addEventListener("click",e=>{const i=e.target.dataset.rm;if(i===undefined)return;const b=S.bets.splice(+i,1)[0];S.bank=Math.round((S.bank+b.stake)*100)/100;save();renderAll()});
document.querySelector(".stake").addEventListener("click",e=>{
  const d=e.target.dataset,el=$("stake");if(e.target.disabled)return;
  if(d.add)el.value=stake()+(+d.add);
  if(d.all){const m=Math.min(S.bank,maxBet());el.value=Math.floor(S.type==="ew"?m/2:m)}
  if(d.clear)el.value="";
  updateHint();
});
$("stake").addEventListener("input",updateHint);
$("daily").onclick=startDaily;
$("realbtn").onclick=openReal;
$("mute").onclick=()=>{muted=!muted;if(muted)stopCrowd();$("mute").textContent=muted?"Sound off":"Sound on"};

/* ---------- boot ---------- */
function start(data){
  load(data);
  picker=null;if(S.phase==="race")S.phase="bet"; // a reload mid-race re-opens the same market with bets intact
  renderAll();
  say(S.phase==="bet"?`Betting open on the <b>${S.race.title}</b>. Read the form, pick a runner, then jump.`:"");
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
</html>
